<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lift Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f10;
    --surface2: #242428;
    --surface-weight: #1a2410;
    --border: #2e2e33;
    --border-weight: #3a4a20;
    --accent: #c8f135;
    --text: #f0f0ee;
    --text-muted: #7a7a80;
    --text-dim: #4a4a50;
    --danger: #ff5a5a;
    --skip-color: #f0a030;
    --col1-width: 72px;
    --prev-col-width: 82px;
    --input-h: 48px;
    --chevron-w: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    min-height: 100vh;
  }

  header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .hamburger {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--text-muted);
    border-radius: 2px;
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
  }

  /* Sticky col 1 */
  thead th:first-child,
  tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 10;
    background: var(--bg);
  }
  thead th:first-child::after,
  tbody td:first-child::after {
    content: '';
    position: absolute;
    top: 0; right: -10px;
    width: 10px; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.35), transparent);
    pointer-events: none;
  }

  thead th {
    padding: 5px 8px;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    vertical-align: bottom;
    width: var(--prev-col-width);
    min-width: var(--prev-col-width);
    cursor: default;
  }
  thead th:first-child { width: var(--col1-width); min-width: var(--col1-width); }
  thead th:nth-child(2) { color: var(--accent); }
  thead th.date-latest { color: var(--text-muted); }

  tbody tr { border-bottom: 1px solid var(--border); height: 62px; }
  tbody tr.save-row { height: auto; }
  tbody tr:last-child { border-bottom: none; }
  tbody td { padding: 0 6px; vertical-align: middle; overflow: hidden; max-height: 62px; }
  tbody td:first-child { padding: 0 4px 0 6px; }
  td.editing-cell { padding: 0 5px; }
  td.prev-cell { padding: 0 6px; vertical-align: middle; }

  .machine-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    width: var(--col1-width);
    min-width: var(--col1-width);
    word-break: break-word;
    padding-right: 4px;
  }

  /* ── Skipped cell ── */
  .skipped-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 2px;
  }
  .skipped-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    flex: 1;
  }
  .unskip-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 5px;
    padding: 5px 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .unskip-btn:active { border-color: var(--text-muted); color: var(--text); }

  /* ── Header hints & edit icon ── */
  .th-inner { display: flex; align-items: center; gap: 4px; }
  .th-hint { font-size: 8px; color: var(--text-dim); flex-shrink: 0; }
  .th-edit-icon {
    font-size: 13px; color: var(--text-muted); cursor: pointer;
    flex-shrink: 0; line-height: 1;
  }
  thead th.editing .th-edit-icon { color: var(--accent); }
  .th-edit-icon:hover { color: var(--text); }
  .th-date-input {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 4px;
    padding: 2px 4px;
    width: 88px;
    outline: none;
  }

  td.today-cell {
    padding: 4px 5px;
    background: #131315;
    border-right: 1px solid var(--border);
  }

  .input-group {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .input-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .input-label {
    font-size: 9px;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding-left: 2px;
    white-space: nowrap;
  }

  .spinner {
    position: relative;
    height: var(--input-h);
    width: 54px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .spinner.kg {
    width: 58px;
    background: var(--surface-weight);
    border-color: var(--border-weight);
  }
  .spinner-val {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    padding: 0;
    width: 100%;
    min-width: 0;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .spinner-val::-webkit-outer-spin-button,
  .spinner-val::-webkit-inner-spin-button { -webkit-appearance: none; }
  .spinner.kg .spinner-val { color: #b8e030; }
  .spinner-btns {
    display: flex;
    flex-direction: column;
    height: 100%;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
    width: var(--chevron-w);
  }
  .spinner.kg .spinner-btns { border-color: var(--border-weight); }
  .chev {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    font-size: 10px;
  }
  .chev:first-child { border-bottom: 1px solid var(--border); }
  .spinner.kg .chev:first-child { border-color: var(--border-weight); }
  .chev:active { background: rgba(255,255,255,0.07); color: var(--text); }
  .spinner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200,241,53,0.15);
  }

  .opts-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 18px;
    width: 30px;
    height: var(--input-h);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    letter-spacing: 0;
    line-height: 0.4;
    padding-bottom: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  .opts-btn:active { border-color: var(--accent); color: var(--accent); }

  .ctx-menu {
    position: fixed;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 0;
    min-width: 200px;
    z-index: 1000;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-backdrop {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
  }
  .ctx-backdrop.open { display: block; }
  .ctx-item {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 11px 16px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    -webkit-user-select: none;
    user-select: none;
  }
  .ctx-item:active { background: rgba(255,255,255,0.06); }
  .ctx-item.danger { color: var(--danger); }
  .ctx-item.skip-item { color: var(--skip-color); }
  .ctx-item.accent { color: var(--accent); }
  .ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }

  .hamburger-menu {
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: 240px;
    background: #1a1a1d;
    border-left: 1px solid var(--border);
    z-index: 1001;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    padding-top: 12px;
  }
  .hamburger-menu.open { transform: translateX(0); }
  .hmenu-header {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    padding: 10px 16px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .prev-cell {
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }
  .wg-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding-top: 0;
  }
  .wg {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    position: relative;
  }
  .wg-up {
    position: absolute;
    top: -10px;
    left: 0;
    font-size: 7px;
    color: var(--accent);
    line-height: 1;
  }
  .wg-weight { font-size: 12px; color: var(--text); white-space: nowrap; }
  .wg-sets { display: flex; flex-direction: row; gap: 5px; }
  .wg-set { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  .save-row td {
    padding: 8px 5px 18px;
    border-top: 1px solid var(--border);
    background: #131315;
  }
  .save-row td.empty { background: var(--bg); border-top: 1px solid var(--border); }
  .save-btn {
    width: 100%;
    background: var(--accent);
    color: #0f0f10;
    border: none;
    border-radius: 7px;
    padding: 13px 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  .save-btn:active { background: #d4f84a; }
  .cancel-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 7px;
    padding: 10px 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
    margin-top: 6px;
    display: block;
  }
  .cancel-btn:active { border-color: var(--text-muted); color: var(--text); }

  thead th.editing {
    color: var(--text-muted) !important;
    background: #1c1c22;
  }
  td.editing-cell {
    padding: 4px 5px;
    background: #1c1c22;
  }
  thead th[data-date]:not(.editing) { cursor: pointer; }
  thead th:not(:first-child):not(:nth-child(2)):not(.editing):hover { color: var(--text-muted); }

  /* Save/cancel side by side */
  .edit-actions { display: flex; gap: 6px; }
  .edit-actions .save-btn { flex: 1; }
  .edit-actions .cancel-btn { flex: 1; margin-top: 0; display: block; }

  /* Date edit popover */
  .date-popover {
    position: fixed;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    z-index: 1100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 180px;
  }
  .date-popover label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .date-popover input {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
  }
  .date-popover input:focus { border-color: var(--accent); }
  .date-popover .popover-actions { display: flex; gap: 6px; }
  .date-popover .pop-ok {
    flex: 1; background: var(--accent); color: #0f0f10; border: none;
    border-radius: 5px; padding: 7px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }
  .date-popover .pop-cancel {
    flex: 1; background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 5px; padding: 7px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }

  /* ── Header export prompt ── */
  .header-export-prompt {
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }
  .header-export-prompt.visible { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hep-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .hep-btn {
    background: var(--accent);
    color: #0f0f10;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .hep-dismiss {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }

  /* ── Sticky bottom button ── */
  .sticky-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px 20px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    z-index: 100;
  }
  .new-session-btn {
    width: 100%;
    background: var(--accent);
    color: #0f0f10;
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  .new-session-btn:active { background: #d4f84a; }


  /* ── Bottom padding so table isn't hidden by sticky btn ── */
  .table-scroll { padding-bottom: 0; }

  /* ── Notes ── */
  .cell-note {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.3;
    max-width: 100%;
    white-space: normal;
    word-break: break-word;
  }
  .note-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 4px;
    vertical-align: middle;
    line-height: 1;
    -webkit-user-select: none;
    user-select: none;
  }
  .note-icon:hover { border-color: var(--text-muted); color: var(--text-muted); }
  .note-tooltip {
    position: fixed;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--text);
    z-index: 1200;
    max-width: 220px;
    white-space: normal;
    word-break: break-word;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    line-height: 1.4;
  }
  .note-popover {
    position: fixed;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 1200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    width: 240px;
  }
  .note-popover textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    resize: none;
    outline: none;
    height: 80px;
    display: block;
    margin-bottom: 8px;
  }
  .note-popover textarea:focus { border-color: var(--accent); }
  .note-popover .popover-actions { display: flex; gap: 6px; }
  .note-popover .pop-ok {
    flex: 1; background: var(--accent); color: #0f0f10; border: none;
    border-radius: 5px; padding: 8px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }
  .note-popover .pop-cancel {
    flex: 1; background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 5px; padding: 8px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }

  /* ── Add exercise tab ── */
  .add-exercise-tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    position: relative;
    left: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 5px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }
  .add-exercise-tab:active { background: var(--surface2); color: var(--accent); }

  /* wrapper sits below col 1 of the table */
  .add-exercise-wrap {
    padding: 0 0 90px 0;
    width: var(--col1-width);
    min-width: var(--col1-width);
    flex-shrink: 0;
  }

  /* Add exercise popover */
  .add-ex-popover {
    position: fixed;
    background: #1e1e22;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 1200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    width: 240px;
  }
  .add-ex-popover label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 6px;
  }
  .add-ex-popover input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    outline: none;
    display: block;
    margin-bottom: 8px;
  }
  .add-ex-popover input:focus { border-color: var(--accent); }
  .add-ex-popover .popover-actions { display: flex; gap: 6px; }
  .add-ex-popover .pop-ok {
    flex: 1; background: var(--accent); color: #0f0f10; border: none;
    border-radius: 5px; padding: 8px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }
  .add-ex-popover .pop-cancel {
    flex: 1; background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 5px; padding: 8px; font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase;
  }

  /* ── Stats toggle button ── */
  .stats-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .stats-toggle.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(200,241,53,0.08);
  }
  .stats-toggle:active { opacity: 0.7; }

  /* ── Stats cells ── */
  td.stats-cell {
    padding: 0 6px;

  .stats-label {
    font-family: 'Space Mono', monospace;

  /* ── Pull to refresh ── */
  .ptr-indicator {

  }

    height: 52px !important;
    border-bottom-color: var(--accent);
  }
  .ptr-inner {
    display: flex;
    align-items: center;

    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;

  }
  .ptr-indicator.releasing .ptr-inner {
    color: var(--accent);
  }
  .ptr-arrow {
    font-size: 14px;
    display: inline-block;
    transition: transform 0.2s ease;
  }
  .ptr-indicator.releasing .ptr-arrow {
    transform: rotate(180deg);
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════
// PERSISTENCE — localStorage
// ═══════════════════════════════════════════════════════════════
const LS_SESSIONS = 'liftlog_sessions';
const LS_MACHINES = 'liftlog_machines';

// Load from localStorage — empty arrays if nothing saved yet
let sessions = JSON.parse(localStorage.getItem(LS_SESSIONS) || 'null') || [];
let MACHINES  = JSON.parse(localStorage.getItem(LS_MACHINES) || 'null') || [];

function savePersisted() {
  localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions));
  localStorage.setItem(LS_MACHINES, JSON.stringify(MACHINES));
}
// ─── Notes helpers ───────────────────────────────────────────
// Note is stored on the last set row for a given date+machine as row.note
function getNote(date, machine) {
  const sets = getSets(date, machine);
  if (!sets.length) return '';
  return sets[sets.length - 1].note || '';
}

function setNote(date, machine, note) {
  const sets = getSets(date, machine);
  if (!sets.length) return;
  // Store on last set
  sets[sets.length - 1].note = note || undefined;
  savePersisted();
}

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Today's date string YYYY-MM-DD
function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════════
// DATA HELPERS
// ═══════════════════════════════════════════════════════════════
function getDates() {
  return [...new Set(sessions.map(r => r.date))].sort().reverse();
}
function getSets(date, machine) {
  return sessions.filter(r => r.date === date && r.machine === machine).sort((a,b) => a.set - b.set);
}
function groupByWeight(sets) {
  const groups = [];
  for (const s of sets) {
    const last = groups[groups.length - 1];
    if (last && last.weight === s.weight) last.reps.push(s.reps);
    else groups.push({ weight: s.weight, reps: [s.reps] });
  }
  return groups;
}
function maxWeight(date, machine) {
  const sets = getSets(date, machine);
  return sets.length ? Math.max(...sets.map(s => s.weight)) : null;
}
function prevDate(date, machine) {
  const dates = getDates();
  const idx = dates.indexOf(date);
  for (let i = idx + 1; i < dates.length; i++) {
    if (getSets(dates[i], machine).length > 0) return dates[i];
  }
  return null;
}
function fmtW(w) { return w === Math.floor(w) ? String(Math.floor(w)) : String(w); }
function fmtDate(d) {
  const [,m,day] = d.split('-');
  return `${parseInt(day)} ${MONTHS[parseInt(m)-1]}`;
}
function lastSets(machine) {
  for (const d of getDates()) {
    const s = getSets(d, machine);
    if (s.length) return s;
  }
  return [];
}
function isValidDate(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s).getTime());
}

// ═══════════════════════════════════════════════════════════════
// DOM BUILDERS
// ═══════════════════════════════════════════════════════════════
function spinHTML(val, isKg) {
  const cls = isKg ? ' kg' : '';
  return `<div class="spinner${cls}"><input class="spinner-val" type="number" value="${val}"><div class="spinner-btns"><button class="chev up">&#8963;</button><button class="chev dn">&#8964;</button></div></div>`;
}

function buildPrevCellHTML(date, machine) {
  const sets = getSets(date, machine);
  if (!sets.length) return '';
  const groups = groupByWeight(sets);
  const curMax = Math.max(...groups.map(g => g.weight));
  const prev = prevDate(date, machine);
  const prevMax = prev ? maxWeight(prev, machine) : null;
  const showUp = prevMax !== null && curMax > prevMax;
  const maxIdx = groups.reduce((mi, g, i) => g.weight > groups[mi].weight ? i : mi, 0);
  const note = getNote(date, machine);
  let html = '<div class="wg-row">';
  groups.forEach((g, i) => {
    const kg = i === groups.length - 1 ? 'kg' : '';
    const arrow = (showUp && i === maxIdx) ? '<div class="wg-up">▲</div>' : '';
    const setsHtml = g.reps.map(r => `<div class="wg-set">${r}</div>`).join('');
    html += `<div class="wg">${arrow}<div class="wg-weight">${fmtW(g.weight)}${kg}</div><div class="wg-sets">${setsHtml}</div></div>`;
  });
  if (note) {
    html += `<span class="note-icon" data-note="${note.replace(/"/g,'&quot;')}">i</span>`;
  }
  return html + '</div>';
}

function buildTodayCellHTML(machine) {
  const sets = lastSets(machine);
  const groups = sets.length ? groupByWeight(sets) : [{weight: 20, reps: [20]}];
  const isCustom = groups.length > 1;
  let html = '<div class="input-group">';
  if (!isCustom) {
    html += `<div class="input-cell kg-cell"><div class="input-label">kg</div>${spinHTML(fmtW(groups[0].weight), true)}</div>`;
    groups[0].reps.forEach((r, i) => {
      html += `<div class="input-cell set-cell"><div class="input-label">Set ${i+1}</div>${spinHTML(r, false)}</div>`;
    });
  } else {
    html += `<div class="input-cell kg-cell shared-kg" style="display:none"><div class="input-label">kg</div>${spinHTML(fmtW(groups[0].weight), true)}</div>`;
    let n = 1;
    groups.forEach(g => g.reps.forEach(r => {
      html += `<div class="input-cell kg-cell"><div class="input-label">kg</div>${spinHTML(fmtW(g.weight), true)}</div>`;
      html += `<div class="input-cell set-cell"><div class="input-label">Set ${n++}</div>${spinHTML(r, false)}</div>`;
    }));
  }
  return html + '<button class="opts-btn">&#8943;</button></div>';
}

function buildInputGroupFromGroups(groups) {
  const isCustom = groups.length > 1;
  let html = '<div class="input-group">';
  if (!isCustom) {
    const g = groups[0] || {weight:0, reps:[0]};
    html += `<div class="input-cell kg-cell"><div class="input-label">kg</div>${spinHTML(fmtW(g.weight), true)}</div>`;
    g.reps.forEach((r,i) => { html += `<div class="input-cell set-cell"><div class="input-label">Set ${i+1}</div>${spinHTML(r, false)}</div>`; });
  } else {
    html += `<div class="input-cell kg-cell shared-kg" style="display:none"><div class="input-label">kg</div>${spinHTML(fmtW(groups[0].weight), true)}</div>`;
    let n = 1;
    groups.forEach(g => g.reps.forEach(r => {
      html += `<div class="input-cell kg-cell"><div class="input-label">kg</div>${spinHTML(fmtW(g.weight), true)}</div>`;
      html += `<div class="input-cell set-cell"><div class="input-label">Set ${n++}</div>${spinHTML(r, false)}</div>`;
    }));
  }
  return html + '<button class="opts-btn">&#8943;</button></div>';
}

// Build a th inner with label + hint/icon
function buildThInner(label, mode) {
  // mode: 'edit' | 'read'
  const hint = mode === 'read' ? '<span class="th-hint">▾</span>' : '';
  const icon = mode === 'edit' ? '<span class="th-edit-icon" title="Edit date">✎</span>' : '';
  return `<div class="th-inner"><span class="th-label">${label}</span>${hint}${icon}</div>`;
}

// ═══════════════════════════════════════════════════════════════
// RENDER — full table build on boot / import
// ═══════════════════════════════════════════════════════════════
function render() {
  const dates = getDates();

  // Header — just machine col + past dates
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = '<th></th>';
  dates.forEach((d, i) => {
    const th = document.createElement('th');
    if (i === 0) th.className = 'date-latest';
    th.innerHTML = buildThInner(fmtDate(d), 'read');
    th.dataset.date = d;
    headerRow.appendChild(th);
  });

  // Body — machine rows with only prev-cells
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  MACHINES.forEach(machine => {
    const tr = document.createElement('tr');
    tr.dataset.exercise = machine;
    tr.innerHTML = `<td><div class="machine-name">${machine}</div></td>`;
    dates.forEach(d => {
      const td = document.createElement('td');
      td.className = 'prev-cell';
      td.dataset.date = d;
      td.innerHTML = buildPrevCellHTML(d, machine);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // Save row — empty col + one empty td per date (for edit mode injection)
  const saveRow = document.createElement('tr');
  saveRow.className = 'save-row';
  saveRow.appendChild(Object.assign(document.createElement('td'), {className: 'empty'}));
  dates.forEach(d => {
    const td = document.createElement('td');
    td.className = 'empty';
    td.dataset.date = d;
    saveRow.appendChild(td);
  });
  tbody.appendChild(saveRow);

  wireHeaderClicks();
  showNewSessionBtn();

  // Show empty state when no exercises defined yet
  updateEmptyState();
}

function updateEmptyState() {
  const showEmpty = MACHINES.length === 0;
  const emptyState = document.getElementById('emptyState');
  const addWrap = document.getElementById('addExerciseWrap');
  const stickyBottom = document.getElementById('stickyBottom');
  if (emptyState) emptyState.style.display = showEmpty ? 'block' : 'none';
  if (addWrap) addWrap.style.display = showEmpty ? 'none' : 'block';
  if (showEmpty) {
    if (stickyBottom) stickyBottom.style.display = 'none';
  } else {
    showNewSessionBtn(); // re-wires the button listener too
  }
}

// ═══════════════════════════════════════════════════════════════
// TARGETED COLUMN UPDATE
// ═══════════════════════════════════════════════════════════════
function renderColumn(date) {
  document.querySelectorAll(`td.prev-cell[data-date="${date}"]`).forEach(td => {
    const machine = td.closest('tr').dataset.exercise;
    td.innerHTML = buildPrevCellHTML(date, machine);
  });
}

// ─── Note tooltip ─────────────────────────────────────────────
let activeTooltip = null;
function closeTooltip() {
  if (activeTooltip) { activeTooltip.remove(); activeTooltip = null; }
}
document.addEventListener('click', e => {
  const icon = e.target.closest('.note-icon');
  if (!icon) { closeTooltip(); return; }
  e.stopPropagation();
  closeTooltip();
  const tip = document.createElement('div');
  tip.className = 'note-tooltip';
  tip.textContent = icon.dataset.note;
  document.body.appendChild(tip);
  activeTooltip = tip;
  // Position near icon
  const rect = icon.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 230 > window.innerWidth - 8) left = window.innerWidth - 238;
  if (top + 80 > window.innerHeight - 8) top = rect.top - 86;
  tip.style.top = top + 'px';
  tip.style.left = left + 'px';
}, true);

// ─── Note popover ─────────────────────────────────────────────
let activeNotePopover = null;
function closeNotePopover() {
  if (activeNotePopover) { activeNotePopover.remove(); activeNotePopover = null; }
}

function showNotePopover(anchor, date, machine) {
  closeNotePopover();

  // For new sessions (not yet in sessions[]), read/write note from DOM data-note attribute
  const isNewSession = editOriginalsMap[date] === null;
  const editCell = document.querySelector(`tbody tr[data-exercise="${machine}"] td.editing-cell[data-date="${date}"]`);

  const existing = isNewSession
    ? (editCell ? editCell.dataset.pendingNote || '' : '')
    : getNote(date, machine);

  const pop = document.createElement('div');
  pop.className = 'note-popover';
  pop.innerHTML = `
    <textarea placeholder="Add a note…">${existing}</textarea>
    <div class="popover-actions">
      <button class="pop-cancel">Cancel</button>
      <button class="pop-ok">Save</button>
    </div>`;
  document.body.appendChild(pop);
  activeNotePopover = pop;

  const rect = anchor.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 250 > window.innerWidth - 8) left = window.innerWidth - 258;
  if (top + 160 > window.innerHeight - 8) top = rect.top - 166;
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';

  const ta = pop.querySelector('textarea');
  ta.focus();

  pop.querySelector('.pop-ok').addEventListener('click', () => {
    const val = ta.value.trim();
    closeNotePopover();

    if (isNewSession) {
      // Store temporarily on the edit cell DOM — written to sessions[] on log
      if (editCell) {
        editCell.dataset.pendingNote = val;
        let noteEl = editCell.querySelector('.cell-note');
        if (val) {
          if (!noteEl) { noteEl = document.createElement('div'); noteEl.className = 'cell-note'; editCell.appendChild(noteEl); }
          noteEl.textContent = '📝 ' + val;
        } else {
          if (noteEl) noteEl.remove();
        }
      }
    } else {
      // Past session — write directly to sessions[]
      setNote(date, machine, val);
      // Update note display in the specific edit cell for this machine
      if (editCell) {
        let noteEl = editCell.querySelector('.cell-note');
        if (val) {
          if (!noteEl) { noteEl = document.createElement('div'); noteEl.className = 'cell-note'; editCell.appendChild(noteEl); }
          noteEl.textContent = '📝 ' + val;
        } else {
          if (noteEl) noteEl.remove();
        }
      }
      // Re-render the prev-cell for this specific machine in this column
      const prevCell = document.querySelector(`tbody tr[data-exercise="${machine}"] td.prev-cell[data-date="${date}"]`);
      if (prevCell) prevCell.innerHTML = buildPrevCellHTML(date, machine);
    }
  });
  pop.querySelector('.pop-cancel').addEventListener('click', closeNotePopover);
}

document.addEventListener('click', e => {
  if (activeNotePopover && !activeNotePopover.contains(e.target) && !e.target.closest('.ctx-item')) {
    closeNotePopover();
  }
});

// ═══════════════════════════════════════════════════════════════
// SPINNER WIRING — integers only; snap to nearest int first
// ═══════════════════════════════════════════════════════════════
function wireSpinner(spinner) {
  const input = spinner.querySelector('.spinner-val');
  spinner.querySelector('.chev.up').addEventListener('click', () => {
    const v = parseFloat(input.value) || 0;
    // Snap to ceiling integer, then add 1 only if already integer
    const snapped = Number.isInteger(v) ? v + 1 : Math.ceil(v);
    input.value = snapped;
  });
  spinner.querySelector('.chev.dn').addEventListener('click', () => {
    const v = parseFloat(input.value) || 0;
    const snapped = Number.isInteger(v) ? v - 1 : Math.floor(v);
    if (snapped >= 0) input.value = snapped;
  });
}

// ═══════════════════════════════════════════════════════════════
// READ INPUTS FROM DOM
// ═══════════════════════════════════════════════════════════════
function readGroupFromInputGroup(group, tr) {
  const custom = tr.dataset.customWeights === 'true';
  const rows = [];
  if (custom) {
    const setCells = Array.from(group.querySelectorAll('.input-cell.set-cell'));
    setCells.forEach((setCell, i) => {
      const allCells = Array.from(group.querySelectorAll('.input-cell'));
      const setIdx = allCells.indexOf(setCell);
      let weight = 0;
      for (let j = setIdx-1; j >= 0; j--) {
        if (allCells[j].classList.contains('kg-cell') && !allCells[j].classList.contains('shared-kg')) {
          weight = parseFloat(allCells[j].querySelector('.spinner-val').value); break;
        }
      }
      rows.push({ set: i+1, weight, reps: parseInt(setCell.querySelector('.spinner-val').value) });
    });
  } else {
    const weight = parseFloat(group.querySelector('.kg-cell .spinner-val').value);
    group.querySelectorAll('.input-cell.set-cell').forEach((c, i) => {
      rows.push({ set: i+1, weight, reps: parseInt(c.querySelector('.spinner-val').value) });
    });
  }
  return rows;
}

function readTodayInputs() {
  const date = todayStr();
  const rows = [];
  document.querySelectorAll('tbody tr[data-exercise]').forEach(tr => {
    const machine = tr.dataset.exercise;
    const group = tr.querySelector('.editing-cell .input-group, .today-cell .input-group');
    if (!group || isCellSkipped(group)) return;
    readGroupFromInputGroup(group, tr).forEach(r => rows.push({date, machine, ...r}));
  });
  return { date, rows };
}

function readEditingInputs(date) {
  const rows = [];
  document.querySelectorAll('tbody tr[data-exercise]').forEach(tr => {
    const machine = tr.dataset.exercise;
    const editCell = tr.querySelector('.editing-cell');
    if (!editCell) return;
    const group = editCell.querySelector('.input-group');
    if (!group || isCellSkipped(group)) return;
    readGroupFromInputGroup(group, tr).forEach(r => rows.push({date, machine, ...r}));
  });
  return rows;
}

// ═══════════════════════════════════════════════════════════════
// NEW SESSION / LOG SESSION
// ═══════════════════════════════════════════════════════════════
function showNewSessionBtn() {
  if (MACHINES.length === 0) return; // stay hidden in empty state
  const sb = document.getElementById('stickyBottom');
  sb.style.display = '';
  sb.innerHTML = '<button class="new-session-btn" id="newSessionBtn">+ New Session</button>';
  document.getElementById('newSessionBtn').addEventListener('click', startNewSession);
}

function startNewSession() {
  const date = todayStr();

  // Prevent duplicate date
  if (getDates().includes(date)) {
    const sb = document.getElementById('stickyBottom');
    const orig = sb.innerHTML;
    sb.innerHTML = `<div style="
      font-family:'Space Mono',monospace; font-size:11px; color:var(--danger);
      text-align:center; padding:14px 16px; text-transform:uppercase; letter-spacing:0.3px;
    ">Session for ${fmtDate(date)} already exists — edit it instead</div>`;
    setTimeout(() => { sb.innerHTML = orig; document.getElementById('newSessionBtn').addEventListener('click', startNewSession); }, 3000);
    return;
  }

  // Exit stats mode if active
  if (statsMode) exitStatsMode();
  // Hide sticky button
  document.getElementById('stickyBottom').style.display = 'none';
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.style.display = 'none';

  // Insert header col at front (after machine col)
  const headerRow = document.getElementById('headerRow');
  const newTh = document.createElement('th');
  newTh.classList.add('editing');
  newTh.innerHTML = buildThInner(fmtDate(date), 'edit');
  newTh.dataset.date = date;
  headerRow.children[0].after(newTh);
  rewireThIcon(newTh);

  // Insert editing-cell for each machine
  document.querySelectorAll('tbody tr[data-exercise]').forEach(tr => {
    const machine = tr.dataset.exercise;
    const ls = lastSets(machine);
    const isCustom = ls.length > 0 && groupByWeight(ls).length > 1;
    tr.dataset.customWeights = isCustom ? 'true' : 'false';
    const editTd = document.createElement('td');
    editTd.className = 'editing-cell';
    editTd.dataset.date = date;
    const groups = ls.length ? groupByWeight(ls) : [{weight: 20, reps: [20]}];
    editTd.innerHTML = buildInputGroupFromGroups(groups);
    tr.children[0].after(editTd);
    editTd.querySelectorAll('.spinner').forEach(wireSpinner);
  });

  // Insert save-row cell with Save + Cancel buttons
  const saveRow = document.querySelector('.save-row');
  const saveTd = document.createElement('td');
  saveTd.className = 'empty';
  saveTd.dataset.date = date;
  saveTd.style.cssText = 'padding:8px 5px 18px; border-top:1px solid var(--border); background:#1c1c22;';
  const actions = document.createElement('div');
  actions.className = 'edit-actions';
  const sBtn = document.createElement('button');
  sBtn.className = 'save-btn';
  sBtn.textContent = 'Save';
  sBtn.addEventListener('click', () => logSession(saveTd.dataset.date));
  const cBtn = document.createElement('button');
  cBtn.className = 'cancel-btn';
  cBtn.textContent = 'Cancel';
  cBtn.addEventListener('click', () => cancelNewSession(saveTd.dataset.date));
  actions.appendChild(sBtn);
  actions.appendChild(cBtn);
  saveTd.appendChild(actions);
  saveRow.children[0].after(saveTd);

  editOriginalsMap[date] = null;

  // Scroll table to left so new column is visible
  requestAnimationFrame(() => {
    const scroll = document.querySelector('.table-scroll');
    if (scroll) scroll.scrollLeft = 0;
  });
}

function logSession(date) {
  const rows = readEditingInputs(date);

  for (let i = sessions.length-1; i >= 0; i--) {
    if (sessions[i].date === date) sessions.splice(i, 1);
  }
  rows.forEach(r => sessions.push(r));

  // Write any pending notes from DOM into the last set of each machine
  document.querySelectorAll(`tbody tr[data-exercise]`).forEach(tr => {
    const machine = tr.dataset.exercise;
    const editCell = tr.querySelector(`.editing-cell[data-date="${date}"]`);
    if (!editCell) return;
    const note = editCell.dataset.pendingNote;
    if (note) setNote(date, machine, note);
  });

  savePersisted();

  // Switch editing-cells to prev-cells and render
  document.querySelectorAll(`.editing-cell[data-date="${date}"]`).forEach(td => {
    td.className = 'prev-cell';
  });
  renderColumn(date);

  // Restore save-row cell
  const saveTd = document.querySelector(`.save-row td[data-date="${date}"]`);
  if (saveTd) { saveTd.innerHTML = ''; saveTd.removeAttribute('style'); }

  // Switch header to read mode
  const th = document.querySelector(`thead th[data-date="${date}"]`);
  if (th) {
    th.classList.remove('editing');
    th.classList.add('date-latest');
    document.querySelectorAll('thead th.date-latest').forEach(t => { if (t !== th) t.classList.remove('date-latest'); });
    th.innerHTML = buildThInner(fmtDate(date), 'read');
    wireHeaderClicks();
  }

  delete editOriginalsMap[date];
  closePopover();
  showNewSessionBtn();
  showExportPrompt();
}

function cancelNewSession(date) {
  // Remove editing col entirely
  document.querySelectorAll(`.editing-cell[data-date="${date}"]`).forEach(td => td.remove());
  const th = document.querySelector(`thead th[data-date="${date}"]`);
  if (th) th.remove();
  const saveTd = document.querySelector(`.save-row td[data-date="${date}"]`);
  if (saveTd) saveTd.remove();
  delete editOriginalsMap[date];
  closePopover();
  showNewSessionBtn();
}

// ═══════════════════════════════════════════════════════════════
// HEADER CLICKS — date edit icon + read-mode dropdown
// ═══════════════════════════════════════════════════════════════
function wireHeaderClicks() {
  // Edit icon on Today th and editing-mode ths
  document.querySelectorAll('thead th .th-edit-icon').forEach(icon => {
    // Remove old listener by replacing node
    const fresh = icon.cloneNode(true);
    icon.replaceWith(fresh);
    fresh.addEventListener('click', e => {
      e.stopPropagation();
      const th = fresh.closest('th');
      showDatePopover(th);
    });
  });
}

function showDatePopover(th) {
  closePopover();
  const currentDate = th.dataset.date;
  const popover = document.createElement('div');
  popover.className = 'date-popover';
  popover.innerHTML = `
    <label>Session date</label>
    <input type="text" value="${currentDate}" maxlength="10" placeholder="YYYY-MM-DD">
    <div class="popover-actions">
      <button class="pop-cancel">Cancel</button>
      <button class="pop-ok">OK</button>
    </div>`;
  document.body.appendChild(popover);
  activePopover = popover;

  const rect = th.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 180 > window.innerWidth - 8) left = window.innerWidth - 188;
  popover.style.top = top + 'px';
  popover.style.left = left + 'px';

  const input = popover.querySelector('input');
  input.focus();
  // Cursor at end, not selected
  const len = input.value.length;
  input.setSelectionRange(len, len);

  const commit = () => {
    const val = input.value.trim();
    if (isValidDate(val) && val !== currentDate) {
      sessions.forEach(r => { if (r.date === currentDate) r.date = val; });
      document.querySelectorAll(`[data-date="${currentDate}"]`).forEach(el => el.dataset.date = val);
      th.dataset.date = val;
      const isEditing = th.classList.contains('editing');
      const isToday = val === todayStr();
      const mode = isEditing ? 'edit' : isToday ? 'today-edit' : 'read';
      th.innerHTML = buildThInner(fmtDate(val), mode);
      rewireThIcon(th);
    }
    closePopover();
  };

  popover.querySelector('.pop-ok').addEventListener('click', commit);
  popover.querySelector('.pop-cancel').addEventListener('click', closePopover);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') closePopover();
  });
}

// ═══════════════════════════════════════════════════════════════
// EXERCISE CONTEXT MENU (⋯ button)
// ═══════════════════════════════════════════════════════════════
const menu = document.getElementById('ctxMenu');
const backdrop = document.getElementById('ctxBackdrop');
let activeRow = null;

function closeMenu() { menu.classList.remove('open'); backdrop.classList.remove('open'); activeRow = null; }
backdrop.addEventListener('click', closeMenu);

function mkDiv(cls) { const d = document.createElement('div'); d.className = cls; return d; }

function makeSpinnerCell(label, value, isKg) {
  const cell = document.createElement('div');
  cell.className = 'input-cell' + (isKg ? ' kg-cell' : ' set-cell');
  cell.innerHTML = `<div class="input-label">${label}</div>${spinHTML(value, isKg)}`;
  wireSpinner(cell.querySelector('.spinner'));
  return cell;
}

function getSetCells(group) { return Array.from(group.querySelectorAll('.input-cell.set-cell')); }
function renumberSets(group) { getSetCells(group).forEach((c,i) => c.querySelector('.input-label').textContent = `Set ${i+1}`); }
function isCustomWeights(row) { return row.dataset.customWeights === 'true'; }

// Auto-switch to consistent weights when only 1 set remains
function checkAutoConsistentWeights(row, group) {
  const sets = getSetCells(group);
  if (sets.length <= 1 && isCustomWeights(row)) {
    // Collapse: take first per-set kg value, restore shared kg, remove per-set kgs
    const firstPerSet = group.querySelector('.kg-cell:not(.shared-kg) .spinner-val');
    group.querySelectorAll('.kg-cell').forEach(c => {
      if (c.classList.contains('shared-kg')) {
        if (firstPerSet) c.querySelector('.spinner-val').value = firstPerSet.value;
        c.style.display = '';
        c.classList.remove('shared-kg');
      } else { c.remove(); }
    });
    row.dataset.customWeights = 'false';
  }
}

function isCellSkipped(group) {
  return group.querySelector('.skipped-cell') !== null;
}

function skipCell(group, row, machine) {
  const optsBtn = group.querySelector('.opts-btn');
  // Remove everything except opts-btn
  Array.from(group.children).forEach(c => { if (c !== optsBtn) c.remove(); });
  // Insert skipped notice + unskip button before opts-btn
  const notice = document.createElement('div');
  notice.className = 'skipped-cell';
  notice.innerHTML = `<span class="skipped-label">Skipped</span><button class="unskip-btn">Unskip</button>`;
  notice.querySelector('.unskip-btn').addEventListener('click', () => unskipCell(group, row, machine));
  group.insertBefore(notice, optsBtn);
  // Hide opts-btn while skipped
  optsBtn.style.display = 'none';
}

function unskipCell(group, row, machine) {
  // Remove skipped notice
  group.querySelector('.skipped-cell')?.remove();
  // Show opts-btn
  const optsBtn = group.querySelector('.opts-btn');
  if (optsBtn) optsBtn.style.display = '';
  // Repopulate from last known data for this machine
  const prior = lastSets(machine);
  const groups = prior.length ? groupByWeight(prior) : [{weight: 20, reps: [20]}];
  const isCustom = groups.length > 1;
  if (!isCustom) {
    group.insertBefore(makeSpinnerCell('kg', fmtW(groups[0].weight), true), optsBtn);
    groups[0].reps.forEach((r, i) => group.insertBefore(makeSpinnerCell(`Set ${i+1}`, r, false), optsBtn));
    row.dataset.customWeights = 'false';
  } else {
    const sharedCell = makeSpinnerCell('kg', fmtW(groups[0].weight), true);
    sharedCell.classList.add('shared-kg');
    sharedCell.style.display = 'none';
    group.insertBefore(sharedCell, optsBtn);
    let n = 1;
    groups.forEach(g => g.reps.forEach(r => {
      group.insertBefore(makeSpinnerCell('kg', fmtW(g.weight), true), optsBtn);
      group.insertBefore(makeSpinnerCell(`Set ${n++}`, r, false), optsBtn);
    }));
    row.dataset.customWeights = 'true';
  }
}

function buildExerciseMenu(row, sourceCell) {
  const group = (sourceCell || row).querySelector('.input-group');
  const sets = getSetCells(group);
  const custom = isCustomWeights(row);
  const skipped = isCellSkipped(group);
  menu.innerHTML = '';

  // Add set — default reps to last set's reps, or 20
  const addBtn = document.createElement('button');
  addBtn.className = 'ctx-item accent';
  addBtn.textContent = '＋  Add set';
  addBtn.addEventListener('click', () => {
    const optsBtn = group.querySelector('.opts-btn');
    const lastSetInput = sets.length ? sets[sets.length-1].querySelector('.spinner-val') : null;
    const defaultReps = lastSetInput ? parseInt(lastSetInput.value) || 20 : 20;
    if (custom) {
      const kgVal = group.querySelector('.kg-cell:not(.shared-kg) .spinner-val')?.value || '0';
      group.insertBefore(makeSpinnerCell('kg', kgVal, true), optsBtn);
    }
    group.insertBefore(makeSpinnerCell(`Set ${getSetCells(group).length + 1}`, defaultReps, false), optsBtn);
    closeMenu();
  });
  menu.appendChild(addBtn);

  // Remove sets
  if (sets.length > 0) {
    menu.appendChild(mkDiv('ctx-divider'));
    sets.forEach((setCell, i) => {
      const btn = document.createElement('button');
      btn.className = 'ctx-item danger';
      btn.textContent = `✕  Remove Set ${i+1}`;
      btn.addEventListener('click', () => {
        if (custom) {
          const allCells = Array.from(group.querySelectorAll('.input-cell'));
          const idx = allCells.indexOf(setCell);
          if (idx > 0 && allCells[idx-1].classList.contains('kg-cell') && !allCells[idx-1].classList.contains('shared-kg'))
            allCells[idx-1].remove();
        }
        setCell.remove();
        renumberSets(group);
        checkAutoConsistentWeights(row, group);
        closeMenu();
      });
      menu.appendChild(btn);
    });
  }

  // Skip / unskip — same behaviour for both today and edit columns
  menu.appendChild(mkDiv('ctx-divider'));
  const skipBtn = document.createElement('button');
  skipBtn.className = 'ctx-item skip-item';
  skipBtn.textContent = skipped ? '↩  Unskip exercise' : '⊘  Skip exercise';
  skipBtn.addEventListener('click', () => {
    const machine = row.dataset.exercise;
    if (skipped) {
      unskipCell(group, row, machine);
    } else {
      skipCell(group, row, machine);
    }
    closeMenu();
  });
  menu.appendChild(skipBtn);

  // Custom / consistent weights — greyed out if only 1 set
  menu.appendChild(mkDiv('ctx-divider'));
  const weightBtn = document.createElement('button');
  weightBtn.className = 'ctx-item';
  const onlyOneSet = sets.length <= 1;
  if (custom) {
    weightBtn.textContent = '⚖  Consistent weight';
  } else {
    weightBtn.textContent = '⚖  Custom weights per set';
    if (onlyOneSet) {
      weightBtn.style.opacity = '0.35';
      weightBtn.style.pointerEvents = 'none';
    }
  }
  weightBtn.addEventListener('click', () => {
    if (onlyOneSet && !custom) return;
    const currentSets = getSetCells(group);
    const sharedVal = group.querySelector('.kg-cell .spinner-val')?.value || '0';
    if (!custom) {
      const sharedCell = group.querySelector('.kg-cell');
      sharedCell.style.display = 'none';
      sharedCell.classList.add('shared-kg');
      currentSets.forEach(s => group.insertBefore(makeSpinnerCell('kg', sharedVal, true), s));
      row.dataset.customWeights = 'true';
    } else {
      const firstPerSet = group.querySelector('.kg-cell:not(.shared-kg) .spinner-val');
      group.querySelectorAll('.kg-cell').forEach(c => {
        if (c.classList.contains('shared-kg')) {
          if (firstPerSet) c.querySelector('.spinner-val').value = firstPerSet.value;
          c.style.display = ''; c.classList.remove('shared-kg');
        } else { c.remove(); }
      });
      row.dataset.customWeights = 'false';
    }
    closeMenu();
  });
  menu.appendChild(weightBtn);

  // Note option — only in edit mode (sourceCell is editing-cell)
  if (sourceCell && sourceCell.classList.contains('editing-cell')) {
    const date = sourceCell.dataset.date;
    const machine = row.dataset.exercise;
    const isNewSession = editOriginalsMap[date] === null;
    const existingNote = isNewSession
      ? (sourceCell.dataset.pendingNote || '')
      : getNote(date, machine);
    menu.appendChild(mkDiv('ctx-divider'));

    if (existingNote) {
      const editNoteBtn = document.createElement('button');
      editNoteBtn.className = 'ctx-item';
      editNoteBtn.textContent = '📝  Edit note';
      editNoteBtn.addEventListener('click', () => {
        closeMenu();
        showNotePopover(sourceCell.querySelector('.opts-btn') || sourceCell, date, machine);
      });
      menu.appendChild(editNoteBtn);

      const delNoteBtn = document.createElement('button');
      delNoteBtn.className = 'ctx-item danger';
      delNoteBtn.textContent = '✕  Delete note';
      delNoteBtn.addEventListener('click', () => {
        if (isNewSession) {
          delete sourceCell.dataset.pendingNote;
        } else {
          setNote(date, machine, '');
          const prevCell = document.querySelector(`tbody tr[data-exercise="${machine}"] td.prev-cell[data-date="${date}"]`);
          if (prevCell) prevCell.innerHTML = buildPrevCellHTML(date, machine);
        }
        sourceCell.querySelector('.cell-note')?.remove();
        closeMenu();
      });
      menu.appendChild(delNoteBtn);
    } else {
      const addNoteBtn = document.createElement('button');
      addNoteBtn.className = 'ctx-item';
      addNoteBtn.textContent = '📝  Add note';
      addNoteBtn.addEventListener('click', () => {
        closeMenu();
        showNotePopover(sourceCell.querySelector('.opts-btn') || sourceCell, date, machine);
      });
      menu.appendChild(addNoteBtn);
    }
  }
}

function positionMenu(el, anchor, w, h) {
  const rect = anchor.getBoundingClientRect();
  let top = rect.bottom + 6, left = rect.right - w;
  if (left < 8) left = 8;
  if (top + h > window.innerHeight - 8) top = rect.top - h - 6;
  el.style.top = top + 'px'; el.style.left = left + 'px';
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.opts-btn');
  if (!btn) return;
  const row = btn.closest('tr');
  // Find the cell containing this opts-btn
  const sourceCell = btn.closest('td');
  if (activeRow === row && menu.classList.contains('open')) { closeMenu(); return; }
  activeRow = row;
  buildExerciseMenu(row, sourceCell);
  positionMenu(menu, btn, 220, 320);
  menu.classList.add('open');
  backdrop.classList.add('open');
});

const dateMenu = document.getElementById('dateCtxMenu');
const dateBackdrop = document.getElementById('dateCtxBackdrop');

function closeDateMenu() { dateMenu.classList.remove('open'); dateBackdrop.classList.remove('open'); }
dateBackdrop.addEventListener('click', closeDateMenu);

document.getElementById('headerRow').addEventListener('click', e => {

// ═══════════════════════════════════════════════════════════════
// DATE EDIT POPOVER
// ═══════════════════════════════════════════════════════════════
let activePopover = null;

function showDatePopover(th) {
  closePopover();
  const currentDate = th.dataset.date;
  const popover = document.createElement('div');
  popover.className = 'date-popover';
  popover.innerHTML = `
    <label>Session date</label>
    <input type="text" value="${currentDate}" maxlength="10" placeholder="YYYY-MM-DD">
    <div class="popover-actions">
      <button class="pop-cancel">Cancel</button>
      <button class="pop-ok">OK</button>
    </div>`;
  document.body.appendChild(popover);
  activePopover = popover;

  // Position below the th
  const rect = th.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 180 > window.innerWidth - 8) left = window.innerWidth - 188;
  popover.style.top = top + 'px';
  popover.style.left = left + 'px';

  const input = popover.querySelector('input');
  input.focus();
  // Cursor at end, not selected
  const len = input.value.length;
  input.setSelectionRange(len, len);

  const commit = () => {
    const val = input.value.trim();
    if (isValidDate(val) && val !== currentDate) {
      // Reject if another session already uses this date
      if (getDates().includes(val)) {
        input.style.borderColor = 'var(--danger)';
        input.title = `A session for ${fmtDate(val)} already exists`;
        return;
      }
      // Rename date in sessions data
      sessions.forEach(r => { if (r.date === currentDate) r.date = val; });
      // Update all data-date attributes
      document.querySelectorAll(`[data-date="${currentDate}"]`).forEach(el => el.dataset.date = val);
      th.dataset.date = val;
      // Update th label
      const isEditing = th.classList.contains('editing');
      th.innerHTML = buildThInner(fmtDate(val), isEditing ? 'edit' : 'read');
      rewireThIcon(th);
    }
    closePopover();
  };

  popover.querySelector('.pop-ok').addEventListener('click', commit);
  popover.querySelector('.pop-cancel').addEventListener('click', closePopover);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') closePopover();
  });
}

function closePopover() {
  if (activePopover) { activePopover.remove(); activePopover = null; }
}

// Close popover on outside click
document.addEventListener('click', e => {
  if (activePopover && !activePopover.contains(e.target) && !e.target.closest('.th-edit-icon')) {
    closePopover();
  }
}, true);

function rewireThIcon(th) {
  const icon = th.querySelector('.th-edit-icon');
  if (icon) icon.addEventListener('click', e => { e.stopPropagation(); showDatePopover(th); });
}

// ═══════════════════════════════════════════════════════════════
// EDIT MODE — per-column, independent
// ═══════════════════════════════════════════════════════════════
// editOriginals is keyed by date so multiple columns can be open simultaneously
const editOriginalsMap = {}; // date -> { machine -> outerHTML }

function anyEditing() {
  return document.querySelector('thead th.editing') !== null;
}

function syncStickyBtn() {
  const sb = document.getElementById('stickyBottom');
  if (anyEditing()) {
    sb.style.display = 'none';
  } else {
    sb.style.display = '';
  }
}

function enterEditMode(date, th) {
  // Exit stats mode first if active
  if (statsMode) exitStatsMode();
  th.classList.add('editing');
  th.innerHTML = buildThInner(fmtDate(date), 'edit');
  rewireThIcon(th);
  editOriginalsMap[date] = {};
  syncStickyBtn();

  document.querySelectorAll('tbody tr[data-exercise]').forEach(tr => {
    const machine = tr.dataset.exercise;
    const td = tr.querySelector(`td.prev-cell[data-date="${date}"]`);
    if (!td) return;
    editOriginalsMap[date][machine] = td.outerHTML;
    const sets = getSets(date, machine);
    const editTd = document.createElement('td');
    editTd.className = 'editing-cell';
    editTd.dataset.date = date;
    if (!sets.length) {
      editTd.innerHTML = buildInputGroupFromGroups([{weight:0, reps:[0]}]);
      td.replaceWith(editTd);
      editTd.querySelectorAll('.spinner').forEach(wireSpinner);
      const group = editTd.querySelector('.input-group');
      skipCell(group, tr, machine);
    } else {
      const groups = groupByWeight(sets);
      if (groups.length > 1) tr.dataset.customWeights = 'true';
      editTd.innerHTML = buildInputGroupFromGroups(groups);
      td.replaceWith(editTd);
      editTd.querySelectorAll('.spinner').forEach(wireSpinner);
    }
    // Show existing note in edit cell
    const existingNote = getNote(date, machine);
    if (existingNote) {
      const noteEl = document.createElement('div');
      noteEl.className = 'cell-note';
      noteEl.textContent = '📝 ' + existingNote;
      editTd.appendChild(noteEl);
    }
  });

  // Save-row: find cell by data-date
  const saveTd = document.querySelector(`.save-row td[data-date="${date}"]`);
  if (saveTd) {
    saveTd._origHTML = saveTd.innerHTML;
    saveTd._origStyle = saveTd.getAttribute('style') || '';
    saveTd.style.cssText = 'padding:8px 5px 18px; border-top:1px solid var(--border); background:#1c1c22;';
    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    const sBtn = document.createElement('button');
    sBtn.className = 'save-btn';
    sBtn.style.background = 'var(--accent); color: #0f0f10;';
    sBtn.textContent = 'Save';
    sBtn.addEventListener('click', () => exitEditMode(saveTd.dataset.date, true));
    const cBtn = document.createElement('button');
    cBtn.className = 'cancel-btn';
    cBtn.textContent = 'Cancel';
    cBtn.addEventListener('click', () => exitEditMode(saveTd.dataset.date, false));
    actions.appendChild(sBtn);
    actions.appendChild(cBtn);
    saveTd.innerHTML = '';
    saveTd.appendChild(actions);
  }
}

function exitEditMode(date, save) {
  const th = document.querySelector(`thead th[data-date="${date}"]`);
  const originals = editOriginalsMap[date] || {};

  if (save) {
    // Snapshot notes before deleting old rows
    const savedNotes = {};
    MACHINES.forEach(machine => {
      const note = getNote(date, machine);
      if (note) savedNotes[machine] = note;
    });
    // Also capture any pendingNote on editing cells (belt and suspenders)
    document.querySelectorAll(`tbody tr[data-exercise]`).forEach(tr => {
      const machine = tr.dataset.exercise;
      const editCell = tr.querySelector(`.editing-cell[data-date="${date}"]`);
      if (editCell && editCell.dataset.pendingNote) savedNotes[machine] = editCell.dataset.pendingNote;
    });

    const newRows = readEditingInputs(date);
    for (let i = sessions.length-1; i >= 0; i--) {
      if (sessions[i].date === date) sessions.splice(i, 1);
    }
    newRows.forEach(r => sessions.push(r));

    // Re-apply notes to new last-set rows
    Object.entries(savedNotes).forEach(([machine, note]) => setNote(date, machine, note));

    savePersisted();
    showExportPrompt();
    document.querySelectorAll(`.editing-cell[data-date="${date}"]`).forEach(td => {
      td.className = 'prev-cell';
    });
    renderColumn(date);
  } else {
    // Cancel: for past sessions restore originals; for new session just remove col
    const isNewSession = originals === null;
    document.querySelectorAll(`tbody tr[data-exercise]`).forEach(tr => {
      const machine = tr.dataset.exercise;
      const editTd = tr.querySelector(`.editing-cell[data-date="${date}"]`);
      if (!editTd) return;
      if (isNewSession) {
        editTd.remove();
      } else {
        const tmp = document.createElement('tbody');
        tmp.innerHTML = `<tr>${originals[machine] || '<td class="prev-cell"></td>'}</tr>`;
        editTd.replaceWith(tmp.querySelector('td'));
      }
    });
    // Remove the header th and save-row cell if new session
    if (isNewSession) {
      const th = document.querySelector(`thead th[data-date="${date}"]`);
      if (th) th.remove();
      const saveTdNew = document.querySelector(`.save-row td[data-date="${date}"]`);
      if (saveTdNew) saveTdNew.remove();
    }
  }

  // Restore this date's save-row cell only
  const saveTd = document.querySelector(`.save-row td[data-date="${date}"]`);
  if (saveTd && saveTd._origHTML !== undefined) {
    saveTd.innerHTML = saveTd._origHTML;
    if (saveTd._origStyle) saveTd.setAttribute('style', saveTd._origStyle);
    else saveTd.removeAttribute('style');
    delete saveTd._origHTML; delete saveTd._origStyle;
  }

  // Restore th to read mode
  if (th) {
    th.classList.remove('editing');
    th.innerHTML = buildThInner(fmtDate(date), 'read');
  }

  const wasNew = originals === null;
  delete editOriginalsMap[date];
  closePopover();
  if (wasNew) showNewSessionBtn();
  else syncStickyBtn();
}

// ═══════════════════════════════════════════════════════════════
// DELETE SESSION
// ═══════════════════════════════════════════════════════════════
function deleteSession(date, th) {
  for (let i = sessions.length-1; i >= 0; i--) {
    if (sessions[i].date === date) sessions.splice(i, 1);
  }
  savePersisted();
  const wasLatest = th.classList.contains('date-latest');
  th.remove();
  if (wasLatest) {
    const next = document.querySelector('thead th[data-date]');
    // Skip Today th (it always has data-date but is always 2nd child)
    const nextPrev = document.querySelector('thead th[data-date]:not(:nth-child(2))');
    if (nextPrev) nextPrev.classList.add('date-latest');
  }
  document.querySelectorAll(`[data-date="${date}"]`).forEach(el => el.remove());
}

// ═══════════════════════════════════════════════════════════════
// EXPORT CSV
// ═══════════════════════════════════════════════════════════════
function exportCSV() {
  if (!sessions.length) { alert('No sessions to export yet.'); return; }
  const sorted = [...sessions].sort((a,b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    const mi = MACHINES.indexOf(a.machine) - MACHINES.indexOf(b.machine);
    // Fall back to string sort for machines not in MACHINES list
    if (mi !== 0) return mi !== 0 ? mi : a.machine.localeCompare(b.machine);
    return a.set - b.set;
  });
  const lines = ['date,machine,set,weight_kg,reps,note'];
  sorted.forEach(r => {
    const note = (r.note || '').replace(/,/g, ';').replace(/\n/g, ' ');
    lines.push(`${r.date},${r.machine},${r.set},${r.weight},${r.reps},${note}`);
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workouts.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════
// IMPORT CSV
// ═══════════════════════════════════════════════════════════════
document.getElementById('csvImportInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.trim().split('\n');
    if (lines.length < 2) { alert('No data rows found in CSV.'); return; }

    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const iDate    = header.indexOf('date');
    const iMachine = header.indexOf('machine');
    const iSet     = header.indexOf('set');
    const iWeight  = header.indexOf('weight_kg');
    const iReps    = header.indexOf('reps');
    const iNote    = header.indexOf('note'); // optional
    if ([iDate, iMachine, iSet, iWeight, iReps].some(i => i === -1)) {
      alert('CSV missing required columns: date, machine, set, weight_kg, reps.'); return;
    }

    const newRows = [];
    const machineOrder = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length < 5) continue;
      const date    = cols[iDate].trim();
      const machine = cols[iMachine].trim();
      const set     = parseInt(cols[iSet]);
      const weight  = parseFloat(cols[iWeight]);
      const reps    = parseInt(cols[iReps]);
      if (!date || !machine || isNaN(set) || isNaN(weight) || isNaN(reps)) continue;
      const row = { date, machine, set, weight, reps };
      if (iNote !== -1 && cols[iNote] && cols[iNote].trim()) row.note = cols[iNote].trim();
      newRows.push(row);
      if (!machineOrder.includes(machine)) machineOrder.push(machine);
    }

    if (!newRows.length) { alert('No valid rows found.'); return; }
    if (!confirm(`Import ${newRows.length} rows across ${machineOrder.length} exercises? This will replace all current data.`)) return;

    sessions.length = 0;
    newRows.forEach(r => sessions.push(r));
    MACHINES.length = 0;
    machineOrder.forEach(m => MACHINES.push(m));
    savePersisted();
    render();
    alert(`Imported ${newRows.length} rows across ${machineOrder.length} exercises.`);
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ═══════════════════════════════════════════════════════════════
// ADD EXERCISE
// ═══════════════════════════════════════════════════════════════
let addExPopover = null;

function closeAddExPopover() {
  if (addExPopover) { addExPopover.remove(); addExPopover = null; }
}

function openAddExPopover(anchor) {
  if (addExPopover) { closeAddExPopover(); return; }

  const pop = document.createElement('div');
  pop.className = 'add-ex-popover';
  pop.innerHTML = `
    <label>Exercise name</label>
    <input type="text" placeholder="e.g. Bicep Curl" maxlength="40">
    <div class="popover-actions">
      <button class="pop-cancel">Cancel</button>
      <button class="pop-ok">Add</button>
    </div>`;
  document.body.appendChild(pop);
  addExPopover = pop;

  // Position near anchor element
  const rect = anchor.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (left + 250 > window.innerWidth - 8) left = window.innerWidth - 258;
  if (top + 140 > window.innerHeight - 8) top = rect.top - 146;
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';

  const input = pop.querySelector('input');
  input.focus();

  const commit = () => {
    const name = input.value.trim();
    if (!name) { closeAddExPopover(); return; }
    if (MACHINES.includes(name)) { alert(`"${name}" already exists.`); return; }
    closeAddExPopover();
    addExerciseRow(name);
  };

  pop.querySelector('.pop-ok').addEventListener('click', commit);
  pop.querySelector('.pop-cancel').addEventListener('click', closeAddExPopover);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') closeAddExPopover();
  });
}

document.getElementById('addExerciseTab').addEventListener('click', function(e) {
  e.stopPropagation();
  openAddExPopover(this);
});

// Close on outside click
document.addEventListener('click', e => {
  if (addExPopover && !addExPopover.contains(e.target)
      && e.target.id !== 'addExerciseTab'
      && e.target.id !== 'emptyAddExBtn') {
    closeAddExPopover();
  }
});

function addExerciseRow(name) {
  MACHINES.push(name);
  savePersisted();
  updateEmptyState();

  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('tableBody');
  const saveRow = tbody.querySelector('.save-row');

  // Build the new tr
  const tr = document.createElement('tr');
  tr.dataset.exercise = name;

  // Col 1: machine name
  const nameTd = document.createElement('td');
  nameTd.innerHTML = `<div class="machine-name">${name}</div>`;
  tr.appendChild(nameTd);

  // For each column in the header (skip the first th which is the machine col)
  const ths = Array.from(headerRow.querySelectorAll('th')).slice(1);
  ths.forEach(th => {
    const date = th.dataset.date;
    const isEditing = th.classList.contains('editing');

    const td = document.createElement('td');
    td.dataset.date = date;

    // Is this the new-session edit column? (editOriginalsMap[date] === null)
    const isNewSession = date && editOriginalsMap[date] === null;

    if (isEditing && isNewSession) {
      // New session column: prepopulate with defaults
      td.className = 'editing-cell';
      const groups = [{weight: 20, reps: [20]}];
      td.innerHTML = buildInputGroupFromGroups(groups);
      td.querySelectorAll('.spinner').forEach(wireSpinner);
    } else if (isEditing) {
      // Past session in edit mode: show as skipped
      td.className = 'editing-cell';
      td.innerHTML = buildInputGroupFromGroups([{weight: 0, reps: [0]}]);
      td.querySelectorAll('.spinner').forEach(wireSpinner);
      const group = td.querySelector('.input-group');
      skipCell(group, tr, name);
    } else {
      // Read mode: empty (exercise wasn't done)
      td.className = 'prev-cell';
      td.innerHTML = '';
    }
    tr.appendChild(td);
  });

  // Insert before save-row
  tbody.insertBefore(tr, saveRow);

  // Also add an empty td to the save-row for each column
  // (save-row already has the right number; no action needed since we mirror ths)
}


// ═══════════════════════════════════════════════════════════════
// STATS MODE
// ═══════════════════════════════════════════════════════════════
let statsMode = false;

function isAnyEditing() {
  return document.querySelector('thead th.editing') !== null;
}

function computeVolume(date, machine) {
  const sets = getSets(date, machine);
  if (!sets.length) return null;
  return sets.reduce((sum, s) => sum + s.weight * s.reps, 0);
}

function enterStatsMode() {
  if (isAnyEditing()) return;
  statsMode = true;
  document.getElementById('statsToggle').classList.add('active');

  const dates = getDates();

  // Compute per-exercise peak volumes
  MACHINES.forEach(machine => {
    const tr = document.querySelector(`tbody tr[data-exercise="${machine}"]`);
    if (!tr) return;
    const vols = dates.map(d => ({ date: d, vol: computeVolume(d, machine) }));
    let peak = null;
    vols.forEach(v => {
      if (v.vol !== null && (peak === null || v.vol > peak.vol)) peak = v;
    });
    dates.forEach(d => {
      const td = tr.querySelector(`td.prev-cell[data-date="${d}"]`);
      if (!td) return;
      const vol = computeVolume(d, machine);
      td.classList.remove('prev-cell');
      td.classList.add('stats-cell');
      if (vol === null) {
        td.innerHTML = '';
      } else {
        const isPeak = peak && d === peak.date;
        td.innerHTML =
          `<span class="stats-label">Volume</span>` +
          `<span class="stats-value${isPeak ? ' peak' : ''}">${vol.toLocaleString()}kg</span>`;
      }
    });
  });

  // Compute column totals and find peak column
  const colTotals = dates.map(d => {
    const total = MACHINES.reduce((sum, machine) => {
      const v = computeVolume(d, machine);
      return sum + (v || 0);
    }, 0);
    return { date: d, total };
  });
  // Peak column: highest total, most recent on tie (dates newest-first)
  let peakCol = null;
  colTotals.forEach(c => {
    if (c.total > 0 && (peakCol === null || c.total > peakCol.total)) peakCol = c;
  });

  // Populate save-row cells
  dates.forEach(d => {
    const saveTd = document.querySelector(`.save-row td[data-date="${d}"]`);
    if (!saveTd || saveTd._origHTML !== undefined) return; // skip if in edit mode
    const entry = colTotals.find(c => c.date === d);
    const total = entry ? entry.total : 0;
    saveTd._statsBak = saveTd.innerHTML;
    saveTd._statsStyle = saveTd.getAttribute('style') || '';
    if (total > 0) {
      const isPeak = peakCol && d === peakCol.date;
      saveTd.style.cssText = 'padding:6px 6px 12px; border-top:1px solid var(--border); background:var(--bg);';
      saveTd.innerHTML =
        `<span class="stats-label">Total</span>` +
        `<span class="stats-value${isPeak ? ' peak' : ''}">${total.toLocaleString()}kg</span>`;
    }
  });
}

function exitStatsMode() {
  if (!statsMode) return;
  statsMode = false;
  document.getElementById('statsToggle').classList.remove('active');

  const dates = getDates();

  // Restore prev-cells
  MACHINES.forEach(machine => {
    const tr = document.querySelector(`tbody tr[data-exercise="${machine}"]`);
    if (!tr) return;
    dates.forEach(d => {
      const td = tr.querySelector(`td.stats-cell[data-date="${d}"]`);
      if (!td) return;
      td.classList.remove('stats-cell');
      td.classList.add('prev-cell');
      td.innerHTML = buildPrevCellHTML(d, machine);
    });
  });

  // Restore save-row cells
  dates.forEach(d => {
    const saveTd = document.querySelector(`.save-row td[data-date="${d}"]`);
    if (!saveTd || saveTd._statsBak === undefined) return;
    saveTd.innerHTML = saveTd._statsBak;
    if (saveTd._statsStyle) saveTd.setAttribute('style', saveTd._statsStyle);
    else saveTd.removeAttribute('style');
    delete saveTd._statsBak;
    delete saveTd._statsStyle;
  });
}

document.getElementById('statsToggle').addEventListener('click', e => {
  e.stopPropagation();
  if (statsMode) {
    exitStatsMode();
  } else {
    if (isAnyEditing()) return; // button does nothing if editing
    enterStatsMode();
  }
});


// ═══════════════════════════════════════════════════════════════
// PULL TO REFRESH
// ═══════════════════════════════════════════════════════════════
(function() {
  const indicator = document.getElementById('ptrIndicator');
  const label = indicator.querySelector('.ptr-label');
  const THRESHOLD = 72;  // px to pull before triggering
  const MAX_PULL = 90;
  let startY = 0;
  let pulling = false;
  let currentPull = 0;

  function canPull() {
    // Only pull when scrolled to very top
    return window.scrollY <= 0;
  }

  document.addEventListener('touchstart', e => {
    if (!canPull()) return;
    startY = e.touches[0].clientY;
    pulling = false;
    currentPull = 0;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!canPull() && currentPull === 0) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) {
      if (currentPull > 0) {
        currentPull = 0;
        indicator.style.height = '0';
        indicator.classList.remove('pulling', 'releasing');
      }
      return;
    }
    pulling = true;
    currentPull = Math.min(dy * 0.5, MAX_PULL); // dampen
    indicator.style.height = currentPull + 'px';
    if (currentPull >= THRESHOLD) {
      indicator.classList.add('releasing');
      indicator.classList.remove('pulling');
      label.textContent = 'Release to refresh';
    } else {
      indicator.classList.add('pulling');
      indicator.classList.remove('releasing');
      label.textContent = 'Pull to refresh';
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!pulling) return;
    if (currentPull >= THRESHOLD) {
      // Trigger refresh — reload from localStorage
      indicator.style.height = '52px';
      setTimeout(() => {
        window.location.reload();
      }, 300);
    } else {
      indicator.style.height = '0';
      indicator.classList.remove('pulling', 'releasing');
      currentPull = 0;
      pulling = false;
    }
  }, { passive: true });
})();

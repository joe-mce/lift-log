function addExerciseRow(name, insertIdx) {
  if (insertIdx === undefined || insertIdx >= MACHINES.length) {
    MACHINES.push(name);
  } else {
    MACHINES.splice(insertIdx, 0, name);
  }
  savePersisted();
  updateEmptyState();

  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('tableBody');
  const saveRow = tbody.querySelector('.save-row');

  // Build the new tr
  const tr = document.createElement('tr');
  tr.dataset.exercise = name;

  // Col 1: machine name
  const nameTd = document.createElement('td');
  nameTd.innerHTML = `<div class="machine-name">${name}</div>`;
  tr.appendChild(nameTd);

  // For each column in the header (skip the first th which is the machine col)
  const ths = Array.from(headerRow.querySelectorAll('th')).slice(1);
  ths.forEach(th => {
    const date = th.dataset.date;
    const isEditing = th.classList.contains('editing');

    const td = document.createElement('td');
    td.dataset.date = date;

    // Is this the new-session edit column? (editOriginalsMap[date] === null)
    const isNewSession = date && editOriginalsMap[date] === null;

    if (isEditing && isNewSession) {
      // New session column: prepopulate with defaults
      td.className = 'editing-cell';
      const groups = [{weight: 20, reps: [20]}];
      td.innerHTML = buildInputGroupFromGroups(groups);
      td.querySelectorAll('.spinner').forEach(wireSpinner);
    } else if (isEditing) {
      // Past session in edit mode: show as skipped
      td.className = 'editing-cell';
      td.innerHTML = buildInputGroupFromGroups([{weight: 0, reps: [0]}]);
      td.querySelectorAll('.spinner').forEach(wireSpinner);
      const group = td.querySelector('.input-group');
      skipCell(group, tr, name);
    } else {
      // Read mode: empty (exercise wasn't done)
      td.className = 'prev-cell';
      td.innerHTML = '';
    }
    tr.appendChild(td);
  });

  // Insert at correct position (before save-row, respecting insertIdx)
  const allExRows = Array.from(tbody.querySelectorAll('tr[data-exercise]'));
  if (insertIdx !== undefined && insertIdx < allExRows.length) {
    tbody.insertBefore(tr, allExRows[insertIdx]);
  } else {
    tbody.insertBefore(tr, saveRow);
  }

  wireExerciseNameClicks();
}


// ═══════════════════════════════════════════════════════════════
// STATS MODE
// ═══════════════════════════════════════════════════════════════
let statsMode = false;

function isAnyEditing() {
  return document.querySelector('thead th.editing') !== null;
}

function computeVolume(date, machine) {
  const sets = getSets(date, machine);
  if (!sets.length) return null;
  return sets.reduce((sum, s) => sum + s.weight * s.reps, 0);
}

function enterStatsMode() {
  if (isAnyEditing()) return;
  statsMode = true;
  document.getElementById('statsToggle').classList.add('active');
  syncStickyBtn();

  const dates = getDates();

  // Compute per-exercise peak volumes
  MACHINES.forEach(machine => {
    const tr = document.querySelector(`tbody tr[data-exercise="${machine}"]`);
    if (!tr) return;
    const vols = dates.map(d => ({ date: d, vol: computeVolume(d, machine) }));
    let peak = null;
    vols.forEach(v => {
      if (v.vol !== null && (peak === null || v.vol > peak.vol)) peak = v;
    });
    dates.forEach(d => {
      const td = tr.querySelector(`td.prev-cell[data-date="${d}"]`);
      if (!td) return;
      const vol = computeVolume(d, machine);
      td.classList.remove('prev-cell');
      td.classList.add('stats-cell');
      if (vol === null) {
        td.innerHTML = '';
      } else {
        const isPeak = peak && d === peak.date;
        td.innerHTML =
          `<span class="stats-label">Volume</span>` +
          `<span class="stats-value${isPeak ? ' peak' : ''}">${vol.toLocaleString()}kg</span>`;
      }
    });
  });

  // Compute column totals and find peak column
  const colTotals = dates.map(d => {
    const total = MACHINES.reduce((sum, machine) => {
      const v = computeVolume(d, machine);
      return sum + (v || 0);
    }, 0);
    return { date: d, total };
  });
  // Peak column: highest total, most recent on tie (dates newest-first)
  let peakCol = null;
  colTotals.forEach(c => {
    if (c.total > 0 && (peakCol === null || c.total > peakCol.total)) peakCol = c;
  });

  // Populate save-row cells
  dates.forEach(d => {
    const saveTd = document.querySelector(`.save-row td[data-date="${d}"]`);
    if (!saveTd || saveTd._origHTML !== undefined) return; // skip if in edit mode
    const entry = colTotals.find(c => c.date === d);
    const total = entry ? entry.total : 0;
    saveTd._statsBak = saveTd.innerHTML;
    saveTd._statsStyle = saveTd.getAttribute('style') || '';
    if (total > 0) {
      const isPeak = peakCol && d === peakCol.date;
      saveTd.style.cssText = 'padding:6px 6px 12px; border-top:1px solid var(--border); background:var(--bg);';
      saveTd.innerHTML =
        `<span class="stats-label">Total</span>` +
        `<span class="stats-value${isPeak ? ' peak' : ''}">${total.toLocaleString()}kg</span>`;
    }
  });
}

function exitStatsMode() {
  if (!statsMode) return;
  statsMode = false;
  document.getElementById('statsToggle').classList.remove('active');
  syncStickyBtn();

  const dates = getDates();

  // Restore prev-cells
  MACHINES.forEach(machine => {
    const tr = document.querySelector(`tbody tr[data-exercise="${machine}"]`);
    if (!tr) return;
    dates.forEach(d => {
      const td = tr.querySelector(`td.stats-cell[data-date="${d}"]`);
      if (!td) return;
      td.classList.remove('stats-cell');
      td.classList.add('prev-cell');
      td.innerHTML = buildPrevCellHTML(d, machine);
    });
  });

  // Restore save-row cells
  dates.forEach(d => {
    const saveTd = document.querySelector(`.save-row td[data-date="${d}"]`);
    if (!saveTd || saveTd._statsBak === undefined) return;
    saveTd.innerHTML = saveTd._statsBak;
    if (saveTd._statsStyle) saveTd.setAttribute('style', saveTd._statsStyle);
    else saveTd.removeAttribute('style');
    delete saveTd._statsBak;
    delete saveTd._statsStyle;
  });
}

document.getElementById('statsToggle').addEventListener('click', e => {
  e.stopPropagation();
  if (statsMode) {
    exitStatsMode();
  } else {
    if (isAnyEditing()) return; // button does nothing if editing
    enterStatsMode();
  }
});

// REORDER COLUMN BY DATE
// ═══════════════════════════════════════════════════════════════
function reorderColumnByDate(date) {
  // Collect all date ths (excluding machine-name th at index 0)
  const headerRow = document.getElementById('headerRow');
  const allThs = Array.from(headerRow.querySelectorAll('th[data-date]'));
  if (allThs.length <= 1) return; // nothing to reorder

  // Sort by date descending (newest left)
  const sorted = [...allThs].sort((a, b) => b.dataset.date.localeCompare(a.dataset.date));

  // Check if already in correct order
  let needsReorder = false;
  allThs.forEach((th, i) => {
    if (th.dataset.date !== sorted[i].dataset.date) needsReorder = true;
  });
  if (!needsReorder) return;

  // Move header ths into sorted order (insert after machine-name th)
  const machineTh = headerRow.querySelector('th:first-child');
  sorted.forEach(th => machineTh.after(th)); // repeatedly inserting after machineTh reverses, so do in reverse
  // Actually insertAdjacentElement preserves order if we go last-to-first:
  // Re-do: append in reverse sorted order after machine th
  sorted.slice().reverse().forEach(th => machineTh.after(th));

  // Reorder tds in each exercise row and save-row to match
  document.querySelectorAll('tbody tr').forEach(tr => {
    // Get all date-tagged tds
    const dateTds = Array.from(tr.querySelectorAll('td[data-date]'));
    if (!dateTds.length) return;
    // Sort by the same order as sorted ths
    const sortedTds = sorted.map(th => dateTds.find(td => td.dataset.date === th.dataset.date)).filter(Boolean);
    // Re-insert after first td (machine name)
    const firstTd = tr.querySelector('td:first-child');
    sortedTds.slice().reverse().forEach(td => firstTd.after(td));
  });

  // Update date-latest class: newest column (sorted[0]) gets it
  headerRow.querySelectorAll('th[data-date]').forEach(th => th.classList.remove('date-latest'));
  if (sorted[0]) sorted[0].classList.add('date-latest');
}

// ── Edit exercise name ────────────────────────────────────────
let editNamePop = null;
function openEditNamePopover(machine, tr, anchor) {
  if (editNamePop) { editNamePop.remove(); editNamePop = null; }
  const pop = document.createElement('div');
  pop.className = 'add-ex-popover';
  pop.innerHTML = `
    <label>Exercise name</label>
    <input type="text" value="${machine}" maxlength="40">
    <div class="popover-actions">
      <button class="pop-cancel">Cancel</button>
      <button class="pop-ok">Save</button>
    </div>`;
  document.body.appendChild(pop);
  editNamePop = pop;
  const rect = anchor.getBoundingClientRect();
  let top = rect.bottom + 6, left = rect.left;
  if (left + 250 > window.innerWidth - 8) left = window.innerWidth - 258;
  if (top + 140 > window.innerHeight - 8) top = rect.top - 146;
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  const input = pop.querySelector('input');
  input.focus(); input.select();
  const commit = () => {
    const newName = input.value.trim();
    if (!newName || newName === machine) { pop.remove(); editNamePop = null; return; }
    if (MACHINES.includes(newName)) { input.style.borderColor = 'var(--danger)'; return; }
    // Rename in MACHINES
    const idx = MACHINES.indexOf(machine);
    MACHINES[idx] = newName;
    // Rename in sessions
    sessions.forEach(r => { if (r.machine === machine) r.machine = newName; });
    // Update DOM
    tr.dataset.exercise = newName;
    tr.querySelector('.machine-name').textContent = newName;
    savePersisted();
    pop.remove(); editNamePop = null;
  };
  pop.querySelector('.pop-ok').addEventListener('click', commit);
  pop.querySelector('.pop-cancel').addEventListener('click', () => { pop.remove(); editNamePop = null; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { pop.remove(); editNamePop = null; } });
  // outside click
  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!pop.contains(e.target)) { pop.remove(); editNamePop = null; document.removeEventListener('click', handler); }
    });
  }, 0);
}

  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  const input = pop.querySelector('input');

    closeAddExPopover();

  pop.querySelector('.pop-cancel').addEventListener('click', closeAddExPopover);

// ── Delete exercise ───────────────────────────────────────────
function deleteExercise(machine) {
  const idx = MACHINES.indexOf(machine);
  if (idx === -1) return;
  MACHINES.splice(idx, 1);
  for (let i = sessions.length - 1; i >= 0; i--) {
    if (sessions[i].machine === machine) sessions.splice(i, 1);
  }
  savePersisted();
  // Remove the row from DOM
  const tr = document.querySelector(`tbody tr[data-exercise="${machine}"]`);
  if (tr) tr.remove();
  updateEmptyState();
}

function drawStatsChart(machine) {
  const canvas = document.getElementById('statsChart');
  const ctx = canvas.getContext('2d');

  // Oldest-first (left to right)
  const allDates = getDates().slice().reverse(); // getDates() is newest-first, reverse for oldest-first
  const dateDots = allDates.map(d => {
    const sets = getSets(d, machine);
    if (!sets.length) return null;
    const topWeight = Math.max(...sets.map(s => s.weight));
    const volume = sets.reduce((acc, s) => acc + s.weight * s.reps, 0);
    return { date: d, topWeight, volume };
  }).filter(Boolean);

  const DPR = window.devicePixelRatio || 1;
  const availW = statsSheetEl.offsetWidth - 32;
  const H = Math.min(200, Math.round(window.innerHeight * 0.26));

  // Max spacing between points to avoid over-spreading
  const MAX_POINT_GAP = 48;
  const PAD_L = 8, PAD_R = 8, PAD_T = 14, PAD_B = 8;
  const n = dateDots.length;
  const innerW = n <= 1 ? MAX_POINT_GAP : Math.min((n - 1) * MAX_POINT_GAP, availW - PAD_L - PAD_R);
  const W = Math.min(availW, innerW + PAD_L + PAD_R);

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.style.display = 'block'; // left-align naturally
  canvas.style.marginLeft = '0';
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;

  const weights = dateDots.map(d => d.topWeight);
  const volumes = dateDots.map(d => d.volume);
  const wMin = Math.min(...weights) * 0.88;
  const wMax = Math.max(...weights) * 1.12;
  const vMax = Math.max(...volumes) * 1.15;

  const xPos = i => PAD_L + (n <= 1 ? chartW / 2 : (i / (n - 1)) * chartW);
  const yW = v => PAD_T + chartH - ((v - wMin) / (wMax - wMin)) * chartH;
  const yV = v => PAD_T + chartH - (v / vMax) * chartH;

  ctx.clearRect(0, 0, W, H);

  const ACCENT = '#c8f135';
  const VOL_COLOR = 'rgba(99,160,255,0.28)';

  // Bar width
  const barW = n <= 1 ? 20 : Math.max(6, Math.min(22, (chartW / n) * 0.5));

  // ── Volume bars ──────────────────────────────────────────────
  dateDots.forEach((d, i) => {
    const x = xPos(i);
    const yTop = yV(d.volume);
    const barH = (PAD_T + chartH) - yTop;
    const r = 3;
    ctx.fillStyle = VOL_COLOR;
    ctx.beginPath();
    if (barH < r * 2) {
      ctx.rect(x - barW/2, yTop, barW, barH);
    } else {
      ctx.moveTo(x - barW/2 + r, yTop);
      ctx.lineTo(x + barW/2 - r, yTop);
      ctx.quadraticCurveTo(x + barW/2, yTop, x + barW/2, yTop + r);
      ctx.lineTo(x + barW/2, yTop + barH);
      ctx.lineTo(x - barW/2, yTop + barH);
      ctx.lineTo(x - barW/2, yTop + r);
      ctx.quadraticCurveTo(x - barW/2, yTop, x - barW/2 + r, yTop);
    }
    ctx.closePath();
    ctx.fill();
  });

  // ── Weight line ───────────────────────────────────────────────
  if (n > 1) {
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    dateDots.forEach((d, i) => {
      const x = xPos(i), y = yW(d.topWeight);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // ── Dots ─────────────────────────────────────────────────────
  dateDots.forEach((d, i) => {
    const x = xPos(i), y = yW(d.topWeight);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = ACCENT;
    ctx.fill();
    ctx.strokeStyle = '#1a1a1d';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // ── Tap/click tooltip ─────────────────────────────────────────
  // Store dot positions for hit testing
  canvas._dots = dateDots.map((d, i) => ({ x: xPos(i), y: yW(d.topWeight), data: d }));

  // Remove old listener
  if (canvas._tapHandler) canvas.removeEventListener('click', canvas._tapHandler);
  canvas._tapHandler = function(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.offsetWidth / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    // Find nearest dot by x distance
    let nearest = null, minDx = Infinity;
    canvas._dots.forEach(dot => {
      const dx = Math.abs(dot.x - mx);
      if (dx < minDx) { minDx = dx; nearest = dot; }
    });
    if (!nearest || minDx > MAX_POINT_GAP / 2 + 10) return;
    showChartTooltip(nearest.data, e.clientX, e.clientY);
  };
  canvas.addEventListener('click', canvas._tapHandler);
}

let chartTooltip = null;
let chartTooltipTimer = null;
function showChartTooltip(data, cx, cy) {
  if (chartTooltip) { chartTooltip.remove(); chartTooltip = null; }
  const tip = document.createElement('div');
  tip.style.cssText = `
    position:fixed; background:#1e1e22; border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; z-index:1600;
    font-family:'DM Sans',sans-serif; font-size:12px; line-height:1.6;
    box-shadow:0 4px 16px rgba(0,0,0,0.5); pointer-events:none;`;
  const [yr,m,d] = data.date.split('-');
  const MONTHS_T = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateLabel = `${parseInt(d)} ${MONTHS_T[parseInt(m)-1]} ${yr}`;
  tip.innerHTML = `
    <div style="color:var(--text-muted);font-size:10px;font-family:'Space Mono',monospace;margin-bottom:4px;">${dateLabel}</div>
    <div style="color:#c8f135;">&#9679; ${fmtW(data.topWeight)}kg</div>
    <div style="color:rgba(99,160,255,0.9);">&#9646; ${data.volume.toLocaleString()}kg vol</div>`;
  document.body.appendChild(tip);
  chartTooltip = tip;

  // Position above tap point
  const tw = 140, th2 = 80;
  let left = cx - tw / 2;
  let top = cy - th2 - 12;
  if (left < 8) left = 8;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (top < 8) top = cy + 16;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';

  clearTimeout(chartTooltipTimer);
  chartTooltipTimer = setTimeout(() => { if (chartTooltip) { chartTooltip.remove(); chartTooltip = null; } }, 3000);
}

// Close tooltip on tap elsewhere
document.addEventListener('click', e => {
  if (chartTooltip && !e.target.closest('#statsChart')) {
    chartTooltip.remove(); chartTooltip = null;
    clearTimeout(chartTooltipTimer);
  }
});
